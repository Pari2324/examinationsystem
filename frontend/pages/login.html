<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ExamSecure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<div class="toast" id="toast"><span id="toastMsg"></span><button onclick="closeToast()">×</button></div>

<!-- Mini header -->
<header id="header">
  <div class="container hdr-inner">
    <a class="logo" href="../index.html">
      <span class="logo-icon">📝</span>
      <span class="logo-name">ExamSecure</span>
    </a>
    <div class="hdr-actions">
      <button class="btn-ghost" id="themeBtn">🌙</button>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size:40px;margin-bottom:12px;">🔐</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your ExamSecure account</p>
    </div>

    <!-- Role tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabStudent" onclick="switchTab('student')">👨‍🎓 Student</button>
      <button class="auth-tab" id="tabAdmin" onclick="switchTab('admin')">👨‍💼 Admin</button>
    </div>

    <form class="auth-form" id="loginForm" novalidate>
      <div class="fg">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" required/>
        <span class="err" id="loginEmailErr"></span>
      </div>
      <div class="fg">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required/>
        <span class="err" id="loginPwErr"></span>
      </div>
      <button type="submit" class="btn-primary lg full" id="loginBtn">
        Sign In →
      </button>
    </form>

    <!-- Demo credentials hint -->
    <div class="demo-creds">
      <p><strong>Demo credentials:</strong></p>
      <p>Student: <strong>student@demo.com</strong> / <strong>student123</strong></p>
      <p>Admin: <strong>admin@demo.com</strong> / <strong>admin123</strong></p>
    </div>

    <div class="auth-footer">
      <a href="../index.html">← Back to Home</a>
    </div>
  </div>
</main>

<script src="../js/theme.js"></script>
<script>
// ── TAB SWITCH ──
let currentRole = 'student';
function switchTab(role) {
  currentRole = role;
  document.getElementById('tabStudent').classList.toggle('active', role === 'student');
  document.getElementById('tabAdmin').classList.toggle('active', role === 'admin');
}

// ── LOGIN FORM ──
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('loginForm');
  const emailEl = document.getElementById('loginEmail');
  const pwEl    = document.getElementById('loginPassword');
  const emailErr = document.getElementById('loginEmailErr');
  const pwErr    = document.getElementById('loginPwErr');
  const btn     = document.getElementById('loginBtn');

  // Demo credentials (frontend-only fallback)
  const DEMO = {
    student: { email: 'student@demo.com', password: 'student123', name: 'Demo Student', role: 'student' },
    admin:   { email: 'admin@demo.com',   password: 'admin123',   name: 'Demo Admin',   role: 'admin'   },
  };

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    emailErr.textContent = ''; pwErr.textContent = '';

    const email = emailEl.value.trim();
    const password = pwEl.value;
    let valid = true;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailErr.textContent = 'Valid email required'; emailEl.classList.add('has-error'); valid = false;
    } else { emailEl.classList.remove('has-error'); emailEl.classList.add('has-ok'); }

    if (!password || password.length < 6) {
      pwErr.textContent = 'Password min 6 chars'; pwEl.classList.add('has-error'); valid = false;
    } else { pwEl.classList.remove('has-error'); pwEl.classList.add('has-ok'); }

    if (!valid) return;

    btn.textContent = 'Signing in…'; btn.disabled = true;

    try {
      // Try real API first
      const res = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role: currentRole }),
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        redirect(data.user.role);
        return;
      } else {
        throw new Error(data.message || 'Login failed');
      }
    } catch (apiErr) {
      // Demo fallback (when API is offline)
      const demo = DEMO[currentRole];
      if (demo && email === demo.email && password === demo.password) {
        const fakeToken = btoa(JSON.stringify({ id: '000', role: currentRole, exp: Date.now() + 86400000 }));
        localStorage.setItem('token', fakeToken);
        localStorage.setItem('user', JSON.stringify({ name: demo.name, email: demo.email, role: currentRole }));
        showToast('✅ Demo login successful!');
        setTimeout(() => redirect(currentRole), 800);
      } else {
        showToast('❌ Invalid credentials');
        pwErr.textContent = apiErr.message || 'Invalid email or password';
      }
    } finally {
      btn.textContent = 'Sign In →'; btn.disabled = false;
    }
  });

  function redirect(role) {
    if (role === 'admin') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'student.html';
    }
  }

  // Check if already logged in
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  if (user) {
    redirect(user.role);
  }
});
</script>
</body>
</html>
